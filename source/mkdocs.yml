# === Основная информация ===
site_name: Иван Пушкин
site_description: Сайт-визитка Ивана Пушкина — достижения, хакатоны и лабораторные работы по курсу программирования
site_author: Иван Пушкин
copyright: © 2026 Иван Пушкин · сделано на бананах

# === Тема Material ===
theme:
  name: material
  language: ru
  logo: images/banana.svg
  favicon: images/banana.svg
  font:
    text: Manrope
    code: JetBrains Mono
  palette:
    # Первая схема — по умолчанию: тёмная. Светлая — по переключателю
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Светлая тема
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Тёмная тема
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - toc.follow

# === Навигация ===
nav:
  - Главная: index.md
  - Об авторе: about.md
  - Лабораторные работы:
      - №1 · Сайт на MkDocs: labs/lab1.md
      - №2 · NumPy: labs/lab2.md
      - №3: labs/lab3.md
      - №4 · Классификация: labs/lab4.md
      - №5 · Регрессия: labs/lab5.md
      - №6 · Очистка данных: labs/lab6.md
      - №7 · Анализ текста: labs/lab7.md
      - №8 · Скрапинг: labs/lab8.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/bananas.js

# === Расширения Markdown ===
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg


# === Отключение поиска ===
plugins:
  - search:
      enabled: false

extra:
  generator: false
